<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas 真实供给 · 试用</title>
<style>
:root{--bg:#f6f6f3;--fg:#1d1d1b;--muted:#5b5b57;--line:#d9d9d4;--ok:#0a6b2e;--bad:#a11;--fx:#ffd54a;--real:#cfe8d6}
body{font:14px/1.5 -apple-system,system-ui,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
main{max-width:1040px;margin:0 auto;padding:16px}h1{font-size:20px;margin:4px 0 8px}h2{font-size:16px;margin:20px 0 6px}
.layer{background:#fff;border:2px solid var(--fg);padding:8px 10px}.tag{font-weight:700;padding:1px 6px;border-radius:4px;font-size:12px}
.real{background:var(--real)}.fx{background:var(--fx);color:#3a2a00}.box{background:#fff;border:1px solid var(--line);padding:8px;margin:6px 0}
table{border-collapse:collapse;width:100%;background:#fff;margin:4px 0}td,th{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top;font-size:13px}th{background:#eee}
code{font-size:12px;word-break:break-all}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
button{font:inherit;padding:4px 10px;margin:2px;cursor:pointer}input{font:inherit;padding:3px 6px}#msg{white-space:pre-wrap}
</style></head><body><main>
<h1>Canvas 真实供给 · 试用（hanaworlds-canvas-SUPPLY-01）</h1>
<div class="layer" id="layer">加载中…</div>
<h2>1. 世界（本卡隔离的真实 Luanti 世界）</h2>
<div class="box">新世界名 <input id="worldName" placeholder="可留空"> <button data-act="create">新建平坦世界</button></div>
<div id="worlds"></div>
<h2>2. Stage1 校验配置供给（CompilerConfig）</h2><div id="supply"></div>
<h2>3. Safety 规则与引擎守卫</h2><div id="safety"></div>
<h2>4. 试用写入 → 公开读回 → 历史撤回/重做</h2>
<div class="box"><span class="tag fx">FIXTURE 写入</span> 坐标（JSON，x,y,z 列表）<input id="positions" size="40" value="[[0,40,0],[1,40,0]]">
节点 <input id="node" value="mcl_core:stone"> <button data-act="build">写入</button></div>
<div id="tx"></div>
<h2>结果</h2><div class="box" id="msg">—</div>
</main>
<script>
const $=s=>document.querySelector(s);const esc=v=>String(v??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const j=v=>v===null||v===undefined?'—':'<code>'+esc(typeof v==='string'?v:JSON.stringify(v))+'</code>';
let S=null;
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});const d=await r.json();$('#msg').textContent=(d.ok?'成功 ':'被拒 ')+path+'\n'+JSON.stringify(d.ok?d.result:d.error,null,2);await load();return d;}
function render(){
 const s=S.service;$('#layer').innerHTML='<span class="tag real">REAL</span> '+esc(S.labels.real)+'<br><span class="tag fx">FIXTURE</span> '+esc(S.labels.fixture)+'<br>Canvas '+esc(s.canvas.version)+' · '+esc(s.contracts)+' · 服务 PID '+esc(s.pid)+' · 端口 '+esc(s.port)+' · Session '+j(S.session);
 let w='';if(!S.prerequisites.ready)w+='<div class="box bad">新建前提缺：'+j(S.prerequisites.missing)+'</div>';
 w+='<table><tr><th>世界</th><th>worldRef</th><th>connectionRef</th><th>状态</th><th>操作</th></tr>';
 for(const r of S.worlds){const sel=S.selection&&S.selection.activeWorldRef===r.worldRef;w+='<tr><td>'+esc(r.worldName||r.worldPath)+'</td><td>'+j(r.worldRef)+'</td><td>'+j(r.connectionRef)+'</td><td>'+(r.running?'<span class="ok">运行中</span>':'未运行')+(sel?' · <span class="ok">Canvas 已选</span>':'')+'</td><td>'+(r.running?'<button data-act="select" data-c="'+esc(r.connectionRef)+'">选为当前世界</button><button data-act="stop" data-c="'+esc(r.connectionRef)+'">停止</button>':'<button data-act="start" data-c="'+esc(r.connectionRef)+'">启动并配对</button>')+'</td></tr>';}
 w+='</table>';if(S.selection)w+='<div class="box">当前选择 '+j(S.selection.localContext)+'</div>';$('#worlds').innerHTML=w;
 let p='';if(!S.supply){p='<div class="box">未选世界：没有供给（NOT_BOUND）。</div>';}else if(S.supply.error){p='<div class="box bad">'+j(S.supply.error)+'</div>';}else{const c=S.supply.current,pr=c.profiles.compilationConfig;
  p+='<div class="box">权威 '+j(S.supply.authority)+' · '+j(S.supply.profileVersion)+' · 观察 #'+esc(c.observedSequence)+' '+j(c.observationDigest.slice(0,16))+'</div>';
  p+='<div class="box">适用域 '+j(c.domain)+'<br>来源 '+j(c.sources)+'</div>';
  p+='<div class="box">CompilationConfig <span class="'+(pr.status==='SUPPLIED'?'ok':'bad')+'">'+esc(pr.status)+'</span> · revision '+j(pr.revision)+' · digest '+j(pr.digest)+'</div><table><tr><th>字段</th><th>状态</th><th>值</th><th>来源</th></tr>';
  for(const [f,r] of Object.entries(pr.fields||{}))p+='<tr><td>'+esc(f)+'</td><td class="'+(r.status==='SUPPLIED'?'ok':'bad')+'">'+esc(r.status)+'</td><td>'+j(r.value)+'</td><td>'+(r.provenance?esc(r.provenance.kind)+'<br>'+j(r.provenance.ref)+'<br>rev '+j(r.provenance.sourceRevision):esc(r.reason)+' '+esc(r.need)+(r.cause?' · cause '+esc(r.cause):''))+'</td></tr>';
  p+='</table><div class="box">消费口 hanaworldsCompilerConfig.read：'+(S.compiler.ok?'<span class="ok">返回</span> compilerRevision '+j(S.compiler.compilerRevision):'<span class="bad">拒绝</span> '+j(S.compiler.error))+'</div>';
  p+='<table><tr><th>#</th><th>被取代</th><th>失效原因</th></tr>'+[...S.supply.history].reverse().map(h=>'<tr><td>'+esc(h.observedSequence)+'</td><td>'+esc(h.supersededAt)+'</td><td>'+esc(h.invalidationReasons.join(', '))+'</td></tr>').join('')+'</table>';}
 $('#supply').innerHTML=p;
 const e=S.engineSafety;let g='<div class="box">Safety 规则来源：玩家确认（Canvas 不声明、不供给 SafetyProfile）。</div><div class="box">引擎守卫声明（来自当前连接）'+j(e.declaration)+'</div><table><tr><th>操作</th><th>状态</th><th>未覆盖</th></tr>';
 for(const r of e.operations)g+='<tr><td>'+esc(r.operation)+'</td><td class="'+(r.unmet.length?'bad':'ok')+'">'+esc(r.status)+'</td><td>'+(r.unmet.map(u=>esc(u.guard)+' @ '+esc(u.stage)).join('<br>')||'—')+'</td></tr>';$('#safety').innerHTML=g+'</table>';
 let t='';if(S.lastBuild){const b=S.lastBuild;t+='<div class="box">最近写入 '+j(b.transactionId)+' · 收据 '+esc(b.receipt.status)+' · world '+j(b.receipt.observedWorldRevision)+' <button data-act="readback" data-t="'+esc(b.transactionId)+'">公开读回</button></div>';}
 if(S.history){t+='<table><tr><th>对象</th><th>格</th><th>已应用</th><th>撤回</th><th>重做</th></tr>';for(const o of S.history.objects)t+='<tr><td>'+j(o.objectRef)+'</td><td>'+j(o.cells)+'</td><td>'+(o.applied?'是':'否')+'</td><td>'+(o.undo.available?'<button data-act="undo" data-o="'+esc(o.objectRef)+'">撤回</button>':esc(o.undo.reason))+'</td><td>'+(o.redo.available?'<button data-act="redo" data-o="'+esc(o.objectRef)+'">重做</button>':esc(o.redo.reason))+'</td></tr>';t+='</table>';
  if(S.history.recovery.length)t+='<div class="box bad">未完成事务（待恢复）'+j(S.history.recovery)+'</div>';}
 $('#tx').innerHTML=t;
 for(const b of document.querySelectorAll('button[data-act]'))b.onclick=()=>act(b);
}
async function act(b){const a=b.dataset.act;b.disabled=true;try{
 if(a==='create')await post('/api/create',{worldName:$('#worldName').value||undefined});
 else if(a==='start'||a==='stop'||a==='select')await post('/api/'+a,{connectionRef:b.dataset.c});
 else if(a==='build')await post('/api/build',{positions:JSON.parse($('#positions').value),nodeName:$('#node').value});
 else if(a==='readback')await post('/api/readback',{transactionId:b.dataset.t});
 else if(a==='undo'||a==='redo')await post('/api/'+a,{objectRef:b.dataset.o});
}catch(e){$('#msg').textContent=String(e);}finally{b.disabled=false;}}
async function load(){S=await (await fetch('/api/state')).json();if(S.error){$('#msg').textContent=JSON.stringify(S.error);return;}render();}
load();
</script></body></html>
